<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Heart Attack Prediction</title>

  <!-- Fonts & vendor CSS (same includes as your other pages) -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Poppins:300,400,500,600" rel="stylesheet">
  <link href="../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/css/style2.css" rel="stylesheet">

  <style>
    /* Page base */
    body {
      font-family: "Open Sans", "Poppins", sans-serif;
      padding-top: 92px; /* keep space for fixed header used site-wide */
      background: #f0fdfa;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
        display: none;
    }

    /* outer wrapper */
    .register-container {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 18px;
    }

    /* card */
    .register-card {
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 
    0 35px 90px rgba(0, 0, 0, 0.22),
    0 0 80px rgba(45, 203, 167, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.4);
  display: flex;
  background: #fff;
}

    /* left side hero accent */
    .register-hero {
      flex: 1 1 320px;
      background: linear-gradient(180deg, rgba(17,120,160,0.12), rgba(17,120,160,0.06));
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      min-width: 260px;
      align-items: center;
    }

    .register-hero h2 {
      font-family: "Poppins", sans-serif;
      font-size: 22px;
      color: #124b62;
      margin: 0;
      font-weight: 700;
      text-align: center;
    }

    .register-hero p {
      color: #256a81;
      margin: 0;
      text-align: center;
      max-width: 200px;
      font-size: 14px;
    }

    /* form side */
    .register-body {
      flex: 2 1 480px;
      padding: 34px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #1e2b2b;
    }
    .page-sub {
      color: #6c757d;
      margin-bottom: 18px;
      font-size: 14px;
    }

    label.form-label {
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    .form-control {
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fbfeff;
      padding: 12px 14px;
      height: auto;
      box-shadow: none;
      font-size: 15px;
    }

    .form-control:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(32,122,170,0.07);
      border-color: #2180a9;
    }

    /* password field with toggle */
    .input-with-icon {
      position: relative;
    }
    .input-with-icon .toggle-pass {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #5b6b6b;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items:center;
      justify-content:center;
    }
    .input-with-icon .toggle-pass:focus { outline: none; }

    /* action row */
    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn-primary-hero {
      background: linear-gradient(180deg,#188b4f,#0f6938);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(15,105,56,0.14);
    }

    .btn-outline-secondary {
      background: transparent;
      border: 1px solid rgba(13,37,63,0.08);
      color: #124b62;
      padding: 9px 14px;
      border-radius: 8px;
      text-decoration: none;
    }

    .btn-outline-secondary:hover { text-decoration:none; }

    /* password hint */
    .pw-hint {
      font-size: 13px;
      color: #9aa5a8;
      margin-top: 8px;
    }

    /* error/success small */
    .pw-status {
      margin-left: 8px;
      font-size: 13px;
    }
    .pw-status.bad { color: #c24141; }
    .pw-status.good { color: #16803d; }

    /* alert styling override */
    .alert {
      border-radius: 8px;
      font-size: 14px;
    }

    @media (max-width: 880px) {
      .register-card { flex-direction: column; }
      .register-hero { padding: 22px; min-height: 120px; }
      .register-body { padding: 24px; }
      .register-container { margin: 12px; }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-card">

      <!-- left hero / small branding -->
      <div class="register-hero" aria-hidden="true">
        <h2>Welcome!</h2>
        <p>Create an account to use the Heart Attack Prediction app — fast, private & secure.</p>
        <svg width="86" height="86" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="opacity:.92;">
          <path d="M12 21s-6-4.35-8-7.5C1.7 9.9 6 6 12 6s10.3 3.9 8 7.5C18 16.65 12 21 12 21z" fill="#0f6938" opacity=".12"></path>
          <path d="M12 2v6" stroke="#0f6938" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- form side -->
      <div class="register-body">
        <h1 class="page-title">Register</h1>
        <div class="page-sub">Choose a username and secure password to create your account.</div>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}" novalidate>
          <div class="mb-3">
            <label for="uname" class="form-label">Username</label>
            <input id="uname" name="uname" type="text" class="form-control" required autocomplete="username" placeholder="pick a username">
          </div>

          <div class="mb-3 input-with-icon">
            <label for="pwd" class="form-label">Password</label>
            <input id="pwd" name="pwd" type="password" class="form-control" required autocomplete="new-password" placeholder="Enter password">
            <button type="button" class="toggle-pass" aria-label="Toggle password visibility" data-target="pwd">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <div class="mb-2 input-with-icon">
            <label for="cpwd" class="form-label">Confirm Password</label>
            <input id="cpwd" name="cpwd" type="password" class="form-control" required autocomplete="new-password" placeholder="Repeat password">
            <button type="button" class="toggle-pass" aria-label="Toggle confirm password visibility" data-target="cpwd">
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <div class="pw-hint d-flex align-items-center">
            <div>Make sure passwords match.</div>
            <div id="pwStatus" class="pw-status"></div>
          </div>

          <div class="action-row">
            <button class="btn-primary-hero" type="submit">Create Account</button>
            <a class="btn-outline-secondary" href="{{ url_for('login') }}">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- vendor JS (kept same) -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    // password toggle logic (works for both inputs)
    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (!input) return;
        const isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
      });
    });

    // realtime password match indicator (non-blocking)
    const pwd = document.getElementById('pwd');
    const cpwd = document.getElementById('cpwd');
    const pwStatus = document.getElementById('pwStatus');

    function updatePwStatus() {
      if (!pwd.value && !cpwd.value) {
        pwStatus.textContent = '';
        pwStatus.className = 'pw-status';
        return;
      }
      if (pwd.value === cpwd.value) {
        pwStatus.textContent = 'Passwords match';
        pwStatus.className = 'pw-status good';
      } else {
        pwStatus.textContent = 'Passwords do not match';
        pwStatus.className = 'pw-status bad';
      }
    }

    pwd.addEventListener('input', updatePwStatus);
    cpwd.addEventListener('input', updatePwStatus);

    // optional: prevent form submit if passwords don't match (uncomment to enable)
    // document.querySelector('form').addEventListener('submit', function(e){
    //   if (pwd.value !== cpwd.value) {
    //     e.preventDefault();
    //     alert('Passwords do not match. Please confirm your password.');
    //   }
    // });
  </script>
</body>
</html>
